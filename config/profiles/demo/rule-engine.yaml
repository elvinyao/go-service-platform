workflows:
  - name: WorkflowEngine
    providers:
      - yaml
      - confluence
    mode: or
    pipeline_order:
      - yaml
      - confluence
    action_merge:
      dedup: true
      order: priority

action_merge:
  dedup: true
  order: priority

execution:
  timeout: "10s"
  retry:
    max_attempts: 1

dispatch:
  workers: 4
  queue_size: 64
  ordering_key: "user_id"
  queue_full: block
  dedup:
    enabled: true
    ttl: "10m"
    max_entries: 10000
