# Mattermost bot profile: events come from a Mattermost bot account.
# The bot token is read from the MATTERMOST_BOT_TOKEN environment variable,
# and MATTERMOST_BOT_URL overrides server_url. `make mattermost-up` starts a
# local Mattermost and writes both to deploy/mattermost/.env.
admin:
  address: "127.0.0.1:18080"
  read_header_timeout: "5s"
  read_timeout: "10s"
  write_timeout: "10s"
  idle_timeout: "120s"

inputs:
  websocket:
    enabled: false
  mattermost:
    enabled: true
    server_url: "http://localhost:8065"
    reconnect_interval: "5s"
    ping_interval: "20s"
    read_timeout: "60s"

adapters:
  confluence:
    enabled: false
  mattermost:
    enabled: false
  badgedb:
    enabled: false
