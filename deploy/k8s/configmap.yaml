apiVersion: v1
kind: ConfigMap
metadata:
  name: service-workflow-config
  labels:
    app: service-workflow
data:
  # Logging
  LOG_LEVEL: "info"
  LOG_FORMAT: "json"

  # WebSocket configuration
  WEBSOCKET_URL: "ws://mattermost:8065/api/v4/websocket"

  # Mattermost configuration
  MATTERMOST_URL: "http://mattermost:8065"
  MATTERMOST_TOKEN: ""

  # Confluence configuration
  CONFLUENCE_URL: "http://confluence:8090"
  CONFLUENCE_USERNAME: ""
  CONFLUENCE_PASSWORD: ""
