# Local Mattermost for developing and testing the Mattermost bot integration.
# Not for production: fixed passwords, no TLS, local mode enabled.
#
#   make mattermost-up      # start and provision (admin, team, channel, bot)
#   make mattermost-down    # stop, keep data
#   make mattermost-reset   # stop and delete all data
name: gsp-mattermost

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mmuser
      POSTGRES_PASSWORD: mmuser_password
      POSTGRES_DB: mattermost
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mmuser -d mattermost"]
      interval: 2s
      timeout: 5s
      retries: 30

  mattermost:
    image: mattermost/mattermost-team-edition:12.1
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${MATTERMOST_PORT:-8065}:8065"
    environment:
      MM_SQLSETTINGS_DRIVERNAME: postgres
      MM_SQLSETTINGS_DATASOURCE: postgres://mmuser:mmuser_password@postgres:5432/mattermost?sslmode=disable&connect_timeout=10
      MM_SERVICESETTINGS_SITEURL: http://localhost:${MATTERMOST_PORT:-8065}
      # mmctl --local is how setup.sh provisions users without a password login.
      MM_SERVICESETTINGS_ENABLELOCALMODE: "true"
      MM_SERVICESETTINGS_ENABLEBOTACCOUNTCREATION: "true"
      MM_SERVICESETTINGS_ENABLEUSERACCESSTOKENS: "true"
      MM_LOGSETTINGS_ENABLEDIAGNOSTICS: "false"
      MM_EMAILSETTINGS_SENDEMAILNOTIFICATIONS: "false"
      MM_TEAMSETTINGS_ENABLEOPENSERVER: "true"
    volumes:
      - mattermost-data:/mattermost/data
      - mattermost-config:/mattermost/config

volumes:
  postgres-data:
  mattermost-data:
  mattermost-config:
